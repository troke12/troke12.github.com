<div class="toggleWrapper">
    <input type="checkbox" class="dn" id="theme-toggle" onchange="modeSwitcher()" />
    <label for="theme-toggle" class="toggle">
    <span class="toggle__handler">
      <span class="crater crater--1"></span>
      <span class="crater crater--2"></span>
      <span class="crater crater--3"></span>
    </span>
        <span class="star star--1"></span>
        <span class="star star--2"></span>
        <span class="star star--3"></span>
        <span class="star star--4"></span>
        <span class="star star--5"></span>
        <span class="star star--6"></span>
    </label>
</div>
<script type="text/javascript">
(function() {
    const toggle = document.getElementById('theme-toggle');
    // Storage can throw (blocked site data, private windows); the toggle must
    // still work for the current page when it does.
    function readTheme() {
        try { return localStorage.getItem('theme'); } catch (e) { return null; }
    }
    function saveTheme(value) {
        try { localStorage.setItem('theme', value); } catch (e) {}
    }
    const theme = readTheme();

    // Set theme without touching checkbox (for page load)
    function setTheme(isDark) {
        if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('theme--dark');
            document.documentElement.classList.remove('theme--light');
            saveTheme('dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('theme--light');
            document.documentElement.classList.remove('theme--dark');
            saveTheme('light');
        }
    }
    
    // Initialize on page load
    const isDark = theme !== 'light'; // default to dark
    toggle.checked = isDark;
    setTheme(isDark);
    
    // Handle toggle change - checkbox already changed naturally, just update theme
    window.modeSwitcher = function() {
        setTheme(toggle.checked);
    };
})();
</script>
