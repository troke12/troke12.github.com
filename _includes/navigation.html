{% assign is_landing = false %}
{% if page.layout == 'landing' %}
  {% assign is_landing = true %}
{% endif %}

<nav class="portfolio-nav{% unless is_landing %} scrolled{% endunless %}" id="navbar">
  <div class="nav-container">
    <a href="{{ '/' | relative_url }}" class="nav-logo">{{ site.author }}</a>
    
    <ul class="nav-links">
      <li><a href="{% if is_landing %}#about{% else %}{{ '/#about' | relative_url }}{% endif %}">About</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
      <li><a href="{% if is_landing %}#skills{% else %}{{ '/#skills' | relative_url }}{% endif %}">Skills</a></li>
      <li><a href="{% if is_landing %}#projects{% else %}{{ '/#projects' | relative_url }}{% endif %}">Projects</a></li>
      <li><a href="{% if is_landing %}#experience{% else %}{{ '/#experience' | relative_url }}{% endif %}">Experience</a></li>
      <li><a href="{{ '/services/' | relative_url }}">Services</a></li>
      <li><a href="{% if is_landing %}#contact{% else %}{{ '/#contact' | relative_url }}{% endif %}">Contact</a></li>
    </ul>

    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobileMenu" onclick="toggleMobileMenu()">
      <i class="fas fa-bars"></i>
    </button>
  </div>
</nav>

<div class="menu-overlay" id="menuOverlay" onclick="closeMobileMenu()"></div>

<div class="mobile-menu" id="mobileMenu" role="dialog" aria-modal="true" aria-label="Site menu">
  <button class="close-menu" aria-label="Close menu" onclick="closeMobileMenu()">
    <i class="fas fa-times"></i>
  </button>
  <ul class="mobile-nav-links">
    <li><a href="{% if is_landing %}#about{% else %}{{ '/#about' | relative_url }}{% endif %}" onclick="closeMobileMenu()">About</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" onclick="closeMobileMenu()">Blog</a></li>
    <li><a href="{% if is_landing %}#skills{% else %}{{ '/#skills' | relative_url }}{% endif %}" onclick="closeMobileMenu()">Skills</a></li>
    <li><a href="{% if is_landing %}#projects{% else %}{{ '/#projects' | relative_url }}{% endif %}" onclick="closeMobileMenu()">Projects</a></li>
    <li><a href="{% if is_landing %}#experience{% else %}{{ '/#experience' | relative_url }}{% endif %}" onclick="closeMobileMenu()">Experience</a></li>
    <li><a href="{{ '/services/' | relative_url }}" onclick="closeMobileMenu()">Services</a></li>
    <li><a href="{% if is_landing %}#contact{% else %}{{ '/#contact' | relative_url }}{% endif %}" onclick="closeMobileMenu()">Contact</a></li>
  </ul>
</div>

<script>
{% if is_landing %}
// Navbar scroll effect (only on landing page)
window.addEventListener('scroll', function() {
  const navbar = document.getElementById('navbar');
  if (window.scrollY > 50) {
    navbar.classList.add('scrolled');
  } else {
    navbar.classList.remove('scrolled');
  }
});
{% endif %}

// Mobile menu. The closed panel is visibility:hidden (see _navigation.scss), so
// its links leave the tab order; focus moves in on open and back to the toggle
// on close.
function setMobileMenu(open) {
  var menu = document.getElementById('mobileMenu');
  var toggle = document.querySelector('.nav-toggle');
  menu.classList.toggle('active', open);
  document.getElementById('menuOverlay').classList.toggle('active', open);
  toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  document.body.style.overflow = open ? 'hidden' : '';
  if (open) {
    menu.querySelector('.close-menu').focus();
  } else {
    toggle.focus();
  }
}

function toggleMobileMenu() {
  setMobileMenu(!document.getElementById('mobileMenu').classList.contains('active'));
}

function closeMobileMenu() {
  setMobileMenu(false);
}

// Esc closes; Tab wraps inside the open panel (aria-modal promises this).
document.addEventListener('keydown', function (e) {
  var menu = document.getElementById('mobileMenu');
  if (!menu.classList.contains('active')) return;
  if (e.key === 'Escape') {
    closeMobileMenu();
    return;
  }
  if (e.key !== 'Tab') return;
  var focusable = menu.querySelectorAll('a[href], button');
  var first = focusable[0];
  var last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
});
</script>
