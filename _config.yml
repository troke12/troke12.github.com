url: https://troke.id
baseurl: ""

title: I Made Ocy Darma Putra
author: troke12
email: ochi@troke.id
description: >
  DevOps & Infrastructure Engineer with expertise in system administration, 
  backend operations, and developer platform engineering. Building reliable 
  infrastructure across cybersecurity, cloud-native, and gaming environments.
tagline: "SysAdmin | DevOps | Backend Engineer"
show_excerpts: true

# SEO Settings
lang: en
locale: en_US

# Social/SEO
twitter:
  username: darma_ochi
  card: summary_large_image

facebook:
  publisher: https://www.linkedin.com/in/troke

social:
  name: I Made Ocy Darma Putra
  links:
    - https://twitter.com/darma_ochi
    - https://www.linkedin.com/in/troke
    - https://github.com/troke12

# Open Graph default image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/avatar.png
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      image: /assets/avatar.png

# Google verification (add your verification code)
# google_site_verification: YOUR_VERIFICATION_CODE

# Webmaster tools verification
webmaster_verifications:
  google: # Add your Google Search Console verification code
  bing: # Add your Bing Webmaster verification code

paginate: 5
paginate_path: "/blog/page:num/"

# Tag pages are static files in tag/<slug>/index.html, one per tag, each with
# `layout: tag_page` and `tag: <name>`. GitHub Pages does not allow jekyll-tagging
# or jekyll-archives, so the pages are committed instead of generated by a plugin.

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Portfolio settings
portfolio:
  resume_url: /Imadeocy-Darma-Putra-Resume.pdf
  github: https://github.com/troke12
  linkedin: https://linkedin.com/in/troke
  twitter: https://twitter.com/darma_ochi
  email: ochi@troke.id

# jekyll-dash date format
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
dash:
  # the way how dates should be displayed
  date_format: "%b %-d, %Y"

  # (optional) discqus comment configuration
  disqus:
    shortname: troke12

  # generate social links in footer
  # supported colors: green, red, orange, blue, cyan, pink, teal, yellow, indigo, purple
  social_links:
    - url: https://twitter.com/darma_ochi
      icon: twitter-square
      color: blue
    - url: https://linkedin.com/in/troke
      icon: linkedin
      color: blue
    - url: https://github.com/troke12
      icon: github-square
      color: purple

  # wether the author box should be displayed
  show_author: true

  # the animation speed of the scroll-in effect
  animation_speed: 50

  # wether to enable Right-to-Left support or not
  rtl: false

  # Replaces the default avatar provider (gravatar)
  avatar_source: github
  github_username: troke12
  #avatar_source: local
  #avatar_path: /assets/avatar.png

# Markdown & Syntax Highlighting
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Build settings
# No theme gem: the layouts, includes, sass and assets the site uses are all in the
# repo, so the build does not depend on jekyll-dash.
plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-paginate
 - jekyll-sitemap
